services:
    firebase-emulator:
        build:
            context: ./firebase-emulator
        ports:
            - "8081:8080"
            - "4000:4000"
        healthcheck:
            test: ["CMD", "wget", "-qO-", "http://localhost:8080/"]
            interval: 2s
            timeout: 2s
            retries: 60

    server:
        build:
            context: .
        environment:
            SERVER_ADDR: :8080
            FIRESTORE_PROJECT_ID: demo-tolo
            FIRESTORE_EMULATOR_HOST: firebase-emulator:8080
        ports:
            - "8080:8080"
        depends_on:
            firebase-emulator:
                condition: service_healthy

    runn:
        image: ghcr.io/k1low/runn:v1.11.1@sha256:0c71b25001b3d9acc506f8c69ffd0b1d11625127474fcf13ff7bad2d5a0ccd95
        profiles:
            - runn
        working_dir: /books
        command: ["run", "--verbose", "signaling.yml"]
        volumes:
            - ./scripts/dev/runbooks:/books:ro
        depends_on:
            server:
                condition: service_started
