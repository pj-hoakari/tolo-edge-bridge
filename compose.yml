services:
    firebase-emulator:
        build:
            context: ./firebase-emulator
        ports:
            - "8081:8080"
            - "9099:9099"
            - "4000:4000"
        healthcheck:
            test: ["CMD", "wget", "-qO-", "http://localhost:8080/"]
            interval: 2s
            timeout: 2s
            retries: 60

    fakeidp:
        build:
            context: https://github.com/pj-hoakari/tolo-service-gateway.git#a61f55d8f1124a09839711cbc7d960ddf59f9456
            target: fakeidp
        environment:
            SERVER_ADDR: :8080
            FAKE_IDP_ISSUER: http://fakeidp:8080
            FAKE_IDP_AUDIENCE: backend-api
        ports:
            - "8082:8080"

    server:
        build:
            context: .
        environment:
            SERVER_ADDR: :8080
            FIRESTORE_PROJECT_ID: demo-tolo
            FIRESTORE_EMULATOR_HOST: firebase-emulator:8080
            FIREBASE_AUTH_EMULATOR_HOST: firebase-emulator:9099
            IDP_ISSUER: http://fakeidp:8080
            IDP_AUDIENCE: backend-api
            IDP_JWKS_URL: http://fakeidp:8080/oauth2/jwks
            CONSOLE_CLIENT_ID: console-ui
            EDGE_CLIENT_ID: edge-page
        ports:
            - "8080:8080"
        depends_on:
            firebase-emulator:
                condition: service_healthy
            fakeidp:
                condition: service_started

    runn:
        image: ghcr.io/k1low/runn:v1.11.1@sha256:0c71b25001b3d9acc506f8c69ffd0b1d11625127474fcf13ff7bad2d5a0ccd95
        profiles:
            - runn
        working_dir: /books
        command: ["run", "--verbose", "signaling.yml"]
        volumes:
            - ./scripts/dev/runbooks:/books:ro
        depends_on:
            server:
                condition: service_started
