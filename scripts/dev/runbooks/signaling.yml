desc: fakeidp の event_access で RequestConnection と IssueFirestoreToken の認証・認可、Firestore への書き込み、カスタムトークンでのサインインを確かめる
runners:
  bridge: http://server:8080
  idp: http://fakeidp:8080
  firestore: http://firebase-emulator:8080
  auth: http://firebase-emulator:9099
vars:
  documents: /v1/projects/demo-tolo/databases/(default)/documents
  tenantId: 0123456789abcdef
  eventId: fedcba9876543210
steps:
  waitServer:
    loop:
      count: 30
      until: current.res.status == 200
      minInterval: 1
      maxInterval: 1
    bridge:
      /healthz:
        get: {}
  waitIdP:
    loop:
      count: 30
      until: current.res.status == 200
      minInterval: 1
      maxInterval: 1
    idp:
      /oauth2/jwks:
        get: {}
  reset:
    firestore:
      /emulator/v1/projects/demo-tolo/databases/(default)/documents:
        delete: {}
    test: current.res.status == 200
  consoleToken:
    idp:
      /token:
        post:
          body:
            application/json:
              token_use: event_access
              sub: user-console
              client_id: console-ui
              scope: events.read
              tenant_id: "{{ vars.tenantId }}"
              event_id: "{{ vars.eventId }}"
    test: current.res.status == 200
  requestConnection:
    bridge:
      /tolo.edgebridge.v1.SignalingService/RequestConnection:
        post:
          headers:
            Authorization: "Bearer {{ steps.consoleToken.res.body.access_token }}"
          body:
            application/json:
              edgeDeviceId: edge-1
    test: current.res.status == 200 && current.res.body.sessionId != ""
  session:
    firestore:
      "{{ vars.documents }}/tenants/{{ vars.tenantId }}/events/{{ vars.eventId }}/edgeDevices/edge-1/sessions/{{ steps.requestConnection.res.body.sessionId }}":
        get:
          headers:
            Authorization: Bearer owner
    test: |
      current.res.status == 200
      && current.res.body.fields.status.stringValue == "requested"
      && "timestampValue" in current.res.body.fields.createdAt
  noToken:
    bridge:
      /tolo.edgebridge.v1.SignalingService/RequestConnection:
        post:
          body:
            application/json:
              edgeDeviceId: edge-1
    test: current.res.status == 401 && current.res.body.code == "unauthenticated"
  edgeToken:
    idp:
      /token:
        post:
          body:
            application/json:
              token_use: event_access
              sub: user-edge
              client_id: edge-page
              scope: events.report
              tenant_id: "{{ vars.tenantId }}"
              event_id: "{{ vars.eventId }}"
    test: current.res.status == 200
  edgeRole:
    bridge:
      /tolo.edgebridge.v1.SignalingService/RequestConnection:
        post:
          headers:
            Authorization: "Bearer {{ steps.edgeToken.res.body.access_token }}"
          body:
            application/json:
              edgeDeviceId: edge-1
    test: current.res.status == 403 && current.res.body.code == "permission_denied"
  unknownClientToken:
    idp:
      /token:
        post:
          body:
            application/json:
              token_use: event_access
              sub: user-other
              client_id: other-client
              scope: events.read
              tenant_id: "{{ vars.tenantId }}"
              event_id: "{{ vars.eventId }}"
    test: current.res.status == 200
  unknownClient:
    bridge:
      /tolo.edgebridge.v1.SignalingService/RequestConnection:
        post:
          headers:
            Authorization: "Bearer {{ steps.unknownClientToken.res.body.access_token }}"
          body:
            application/json:
              edgeDeviceId: edge-1
    test: current.res.status == 403 && current.res.body.code == "permission_denied"
  emptyEdgeId:
    bridge:
      /tolo.edgebridge.v1.SignalingService/RequestConnection:
        post:
          headers:
            Authorization: "Bearer {{ steps.consoleToken.res.body.access_token }}"
          body:
            application/json:
              edgeDeviceId: ""
    test: current.res.status == 400 && current.res.body.code == "invalid_argument"
  issueEdgeToken:
    bridge:
      /tolo.edgebridge.v1.SignalingService/IssueFirestoreToken:
        post:
          headers:
            Authorization: "Bearer {{ steps.edgeToken.res.body.access_token }}"
          body:
            application/json: {}
    test: current.res.status == 200 && current.res.body.firebaseCustomToken != "" && current.res.body.expiresAt != ""
  signInEdge:
    auth:
      /identitytoolkit.googleapis.com/v1/accounts:signInWithCustomToken?key=any:
        post:
          body:
            application/json:
              token: "{{ steps.issueEdgeToken.res.body.firebaseCustomToken }}"
              returnSecureToken: true
    test: current.res.status == 200 && current.res.body.idToken != ""
    bind:
      edgeIDTokenPayload: replace(replace(split(current.res.body.idToken, ".")[1], "-", "+"), "_", "/")
  edgeIDTokenClaims:
    bind:
      edgeClaims: fromJSON(fromBase64(edgeIDTokenPayload + repeat("=", (4 - len(edgeIDTokenPayload) % 4) % 4)))
  edgeIDToken:
    test: |
      edgeClaims.sub == "user-edge"
      && edgeClaims.tenant_id == vars.tenantId
      && edgeClaims.event_id == vars.eventId
      && edgeClaims.peer_role == "edge"
      && edgeClaims.expires_at == date(steps.issueEdgeToken.res.body.expiresAt).Unix()
  issueConsoleToken:
    bridge:
      /tolo.edgebridge.v1.SignalingService/IssueFirestoreToken:
        post:
          headers:
            Authorization: "Bearer {{ steps.consoleToken.res.body.access_token }}"
          body:
            application/json: {}
    test: current.res.status == 200 && current.res.body.firebaseCustomToken != "" && current.res.body.expiresAt != ""
  signInConsole:
    auth:
      /identitytoolkit.googleapis.com/v1/accounts:signInWithCustomToken?key=any:
        post:
          body:
            application/json:
              token: "{{ steps.issueConsoleToken.res.body.firebaseCustomToken }}"
              returnSecureToken: true
    test: current.res.status == 200 && current.res.body.idToken != ""
    bind:
      consoleIDTokenPayload: replace(replace(split(current.res.body.idToken, ".")[1], "-", "+"), "_", "/")
  consoleIDTokenClaims:
    bind:
      consoleClaims: fromJSON(fromBase64(consoleIDTokenPayload + repeat("=", (4 - len(consoleIDTokenPayload) % 4) % 4)))
  consoleIDToken:
    test: |
      consoleClaims.sub == "user-console"
      && consoleClaims.tenant_id == vars.tenantId
      && consoleClaims.event_id == vars.eventId
      && consoleClaims.peer_role == "console"
      && consoleClaims.expires_at == date(steps.issueConsoleToken.res.body.expiresAt).Unix()
  issueTokenWithoutToken:
    bridge:
      /tolo.edgebridge.v1.SignalingService/IssueFirestoreToken:
        post:
          body:
            application/json: {}
    test: current.res.status == 401 && current.res.body.code == "unauthenticated"
  issueTokenUnknownClient:
    bridge:
      /tolo.edgebridge.v1.SignalingService/IssueFirestoreToken:
        post:
          headers:
            Authorization: "Bearer {{ steps.unknownClientToken.res.body.access_token }}"
          body:
            application/json: {}
    test: current.res.status == 403 && current.res.body.code == "permission_denied"
