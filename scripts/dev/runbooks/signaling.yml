desc: fakeidp の event_access で RequestConnection と IssueFirestoreToken の認証・認可、edge_device_id と session_id の束縛、Firestore への書き込み、カスタムトークンでのサインイン、セキュリティルールを確かめる
runners:
  bridge: http://server:8080
  idp: http://fakeidp:8080
  firestore: http://firebase-emulator:8080
  auth: http://firebase-emulator:9099
vars:
  documents: /v1/projects/demo-tolo/databases/(default)/documents
  tenantId: 0123456789abcdef
  eventId: fedcba9876543210
  edgeId: "0011223344556677"
  otherEdgeId: 8899aabbccddeeff
steps:
  waitServer:
    loop:
      count: 30
      until: current.res.status == 200
      minInterval: 1
      maxInterval: 1
    bridge:
      /healthz:
        get: {}
  waitIdP:
    loop:
      count: 30
      until: current.res.status == 200
      minInterval: 1
      maxInterval: 1
    idp:
      /oauth2/jwks:
        get: {}
  reset:
    firestore:
      /emulator/v1/projects/demo-tolo/databases/(default)/documents:
        delete: {}
    test: current.res.status == 200
  consoleToken:
    idp:
      /token:
        post:
          body:
            application/json:
              token_use: event_access
              sub: user-console
              client_id: console-ui
              scope: events.read
              tenant_id: "{{ vars.tenantId }}"
              event_id: "{{ vars.eventId }}"
    test: current.res.status == 200
  requestConnection:
    bridge:
      /tolo.edgebridge.v1.SignalingService/RequestConnection:
        post:
          headers:
            Authorization: "Bearer {{ steps.consoleToken.res.body.access_token }}"
          body:
            application/json:
              edgeDeviceId: "{{ vars.edgeId }}"
    test: current.res.status == 200 && current.res.body.sessionId != ""
  session:
    firestore:
      "{{ vars.documents }}/tenants/{{ vars.tenantId }}/events/{{ vars.eventId }}/edgeDevices/{{ vars.edgeId }}/sessions/{{ steps.requestConnection.res.body.sessionId }}":
        get:
          headers:
            Authorization: Bearer owner
    test: |
      current.res.status == 200
      && current.res.body.fields.status.stringValue == "requested"
      && "timestampValue" in current.res.body.fields.createdAt
  requestConnectionOtherEdge:
    bridge:
      /tolo.edgebridge.v1.SignalingService/RequestConnection:
        post:
          headers:
            Authorization: "Bearer {{ steps.consoleToken.res.body.access_token }}"
          body:
            application/json:
              edgeDeviceId: "{{ vars.otherEdgeId }}"
    test: current.res.status == 200 && current.res.body.sessionId != ""
  requestConnectionSecond:
    bridge:
      /tolo.edgebridge.v1.SignalingService/RequestConnection:
        post:
          headers:
            Authorization: "Bearer {{ steps.consoleToken.res.body.access_token }}"
          body:
            application/json:
              edgeDeviceId: "{{ vars.edgeId }}"
    test: current.res.status == 200 && current.res.body.sessionId != ""
  noToken:
    bridge:
      /tolo.edgebridge.v1.SignalingService/RequestConnection:
        post:
          body:
            application/json:
              edgeDeviceId: "{{ vars.edgeId }}"
    test: current.res.status == 401 && current.res.body.code == "unauthenticated" && current.res.body.message == "unauthenticated"
  edgeToken:
    idp:
      /token:
        post:
          body:
            application/json:
              token_use: event_access
              sub: user-edge
              client_id: edge-page
              scope: events.report
              tenant_id: "{{ vars.tenantId }}"
              event_id: "{{ vars.eventId }}"
              edge_device_id: "{{ vars.edgeId }}"
    test: current.res.status == 200
  edgeRole:
    bridge:
      /tolo.edgebridge.v1.SignalingService/RequestConnection:
        post:
          headers:
            Authorization: "Bearer {{ steps.edgeToken.res.body.access_token }}"
          body:
            application/json:
              edgeDeviceId: "{{ vars.edgeId }}"
    test: current.res.status == 403 && current.res.body.code == "permission_denied" && current.res.body.message == "permission denied"
  cameraToken:
    idp:
      /token:
        post:
          body:
            application/json:
              token_use: event_access
              sub: user-camera
              client_id: esp-camera
              scope: events.stream
              tenant_id: "{{ vars.tenantId }}"
              event_id: "{{ vars.eventId }}"
              edge_device_id: "{{ vars.edgeId }}"
    test: current.res.status == 200
  cameraRequestConnection:
    bridge:
      /tolo.edgebridge.v1.SignalingService/RequestConnection:
        post:
          headers:
            Authorization: "Bearer {{ steps.cameraToken.res.body.access_token }}"
          body:
            application/json:
              edgeDeviceId: "{{ vars.edgeId }}"
    test: current.res.status == 403 && current.res.body.code == "permission_denied"
  edgeTokenWithoutEdge:
    idp:
      /token:
        post:
          body:
            application/json:
              token_use: event_access
              sub: user-edge
              client_id: edge-page
              scope: events.report
              tenant_id: "{{ vars.tenantId }}"
              event_id: "{{ vars.eventId }}"
    test: current.res.status == 200
  cameraTokenWithoutEdge:
    idp:
      /token:
        post:
          body:
            application/json:
              token_use: event_access
              sub: user-camera
              client_id: esp-camera
              scope: events.stream
              tenant_id: "{{ vars.tenantId }}"
              event_id: "{{ vars.eventId }}"
    test: current.res.status == 200
  connectionToken:
    idp:
      /token:
        post:
          body:
            application/json:
              token_use: event_access
              sub: user-connection
              client_id: observation-connection
              scope: events.read
              tenant_id: "{{ vars.tenantId }}"
              event_id: "{{ vars.eventId }}"
    test: current.res.status == 200
  unknownClientToken:
    idp:
      /token:
        post:
          body:
            application/json:
              token_use: event_access
              sub: user-other
              client_id: other-client
              scope: events.read
              tenant_id: "{{ vars.tenantId }}"
              event_id: "{{ vars.eventId }}"
    test: current.res.status == 200
  unknownClient:
    bridge:
      /tolo.edgebridge.v1.SignalingService/RequestConnection:
        post:
          headers:
            Authorization: "Bearer {{ steps.unknownClientToken.res.body.access_token }}"
          body:
            application/json:
              edgeDeviceId: "{{ vars.edgeId }}"
    test: current.res.status == 403 && current.res.body.code == "permission_denied"
  emptyEdgeId:
    bridge:
      /tolo.edgebridge.v1.SignalingService/RequestConnection:
        post:
          headers:
            Authorization: "Bearer {{ steps.consoleToken.res.body.access_token }}"
          body:
            application/json:
              edgeDeviceId: ""
    test: current.res.status == 400 && current.res.body.code == "invalid_argument" && current.res.body.message == "edge_device_id is required"
  issueEdgeToken:
    bridge:
      /tolo.edgebridge.v1.SignalingService/IssueFirestoreToken:
        post:
          headers:
            Authorization: "Bearer {{ steps.edgeToken.res.body.access_token }}"
          body:
            application/json: {}
    test: current.res.status == 200 && current.res.body.firebaseCustomToken != "" && current.res.body.expiresAt != ""
  issueEdgeWithoutEdge:
    bridge:
      /tolo.edgebridge.v1.SignalingService/IssueFirestoreToken:
        post:
          headers:
            Authorization: "Bearer {{ steps.edgeTokenWithoutEdge.res.body.access_token }}"
          body:
            application/json: {}
    test: current.res.status == 403 && current.res.body.code == "permission_denied"
  issueCameraWithoutEdge:
    bridge:
      /tolo.edgebridge.v1.SignalingService/IssueFirestoreToken:
        post:
          headers:
            Authorization: "Bearer {{ steps.cameraTokenWithoutEdge.res.body.access_token }}"
          body:
            application/json: {}
    test: current.res.status == 403 && current.res.body.code == "permission_denied"
  issueCameraToken:
    bridge:
      /tolo.edgebridge.v1.SignalingService/IssueFirestoreToken:
        post:
          headers:
            Authorization: "Bearer {{ steps.cameraToken.res.body.access_token }}"
          body:
            application/json: {}
    test: current.res.status == 200 && current.res.body.firebaseCustomToken != "" && current.res.body.expiresAt != ""
  signInEdge:
    auth:
      /identitytoolkit.googleapis.com/v1/accounts:signInWithCustomToken?key=any:
        post:
          body:
            application/json:
              token: "{{ steps.issueEdgeToken.res.body.firebaseCustomToken }}"
              returnSecureToken: true
    test: current.res.status == 200 && current.res.body.idToken != ""
    bind:
      edgeIDTokenPayload: replace(replace(split(current.res.body.idToken, ".")[1], "-", "+"), "_", "/")
  edgeIDTokenClaims:
    bind:
      edgeClaims: fromJSON(fromBase64(edgeIDTokenPayload + repeat("=", (4 - len(edgeIDTokenPayload) % 4) % 4)))
  edgeIDToken:
    test: |
      edgeClaims.sub == "user-edge"
      && edgeClaims.tenant_id == vars.tenantId
      && edgeClaims.event_id == vars.eventId
      && edgeClaims.peer_role == "edge"
      && edgeClaims.edge_device_id == vars.edgeId
      && !("session_id" in edgeClaims)
      && edgeClaims.token_use == "signaling"
      && edgeClaims.expires_at == date(steps.issueEdgeToken.res.body.expiresAt).Unix()
  signInCamera:
    auth:
      /identitytoolkit.googleapis.com/v1/accounts:signInWithCustomToken?key=any:
        post:
          body:
            application/json:
              token: "{{ steps.issueCameraToken.res.body.firebaseCustomToken }}"
              returnSecureToken: true
    test: current.res.status == 200 && current.res.body.idToken != ""
    bind:
      cameraIDTokenPayload: replace(replace(split(current.res.body.idToken, ".")[1], "-", "+"), "_", "/")
  cameraIDTokenClaims:
    bind:
      cameraClaims: fromJSON(fromBase64(cameraIDTokenPayload + repeat("=", (4 - len(cameraIDTokenPayload) % 4) % 4)))
  cameraIDToken:
    test: |
      cameraClaims.sub == "user-camera"
      && cameraClaims.tenant_id == vars.tenantId
      && cameraClaims.event_id == vars.eventId
      && cameraClaims.peer_role == "edge"
      && cameraClaims.edge_device_id == vars.edgeId
      && !("session_id" in cameraClaims)
      && cameraClaims.token_use == "signaling"
      && cameraClaims.expires_at == date(steps.issueCameraToken.res.body.expiresAt).Unix()
  issueConsoleToken:
    bridge:
      /tolo.edgebridge.v1.SignalingService/IssueFirestoreToken:
        post:
          headers:
            Authorization: "Bearer {{ steps.consoleToken.res.body.access_token }}"
          body:
            application/json: {}
    test: current.res.status == 200 && current.res.body.firebaseCustomToken != "" && current.res.body.expiresAt != ""
  issueConnectionToken:
    bridge:
      /tolo.edgebridge.v1.SignalingService/IssueFirestoreToken:
        post:
          headers:
            Authorization: "Bearer {{ steps.connectionToken.res.body.access_token }}"
          body:
            application/json:
              edgeDeviceId: "{{ vars.edgeId }}"
              sessionId: "{{ steps.requestConnection.res.body.sessionId }}"
    test: current.res.status == 200 && current.res.body.firebaseCustomToken != "" && current.res.body.expiresAt != ""
  issueConnectionMissingEdge:
    bridge:
      /tolo.edgebridge.v1.SignalingService/IssueFirestoreToken:
        post:
          headers:
            Authorization: "Bearer {{ steps.connectionToken.res.body.access_token }}"
          body:
            application/json:
              sessionId: "{{ steps.requestConnection.res.body.sessionId }}"
    test: current.res.status == 403 && current.res.body.code == "permission_denied"
  issueConnectionMissingSession:
    bridge:
      /tolo.edgebridge.v1.SignalingService/IssueFirestoreToken:
        post:
          headers:
            Authorization: "Bearer {{ steps.connectionToken.res.body.access_token }}"
          body:
            application/json:
              edgeDeviceId: "{{ vars.edgeId }}"
    test: current.res.status == 403 && current.res.body.code == "permission_denied"
  issueConnectionUnknownSession:
    bridge:
      /tolo.edgebridge.v1.SignalingService/IssueFirestoreToken:
        post:
          headers:
            Authorization: "Bearer {{ steps.connectionToken.res.body.access_token }}"
          body:
            application/json:
              edgeDeviceId: "{{ vars.edgeId }}"
              sessionId: "00000000000000000000"
    test: current.res.status == 403 && current.res.body.code == "permission_denied"
  issueConnectionWrongEdge:
    bridge:
      /tolo.edgebridge.v1.SignalingService/IssueFirestoreToken:
        post:
          headers:
            Authorization: "Bearer {{ steps.connectionToken.res.body.access_token }}"
          body:
            application/json:
              edgeDeviceId: "{{ vars.otherEdgeId }}"
              sessionId: "{{ steps.requestConnection.res.body.sessionId }}"
    test: current.res.status == 403 && current.res.body.code == "permission_denied"
  signInConsole:
    auth:
      /identitytoolkit.googleapis.com/v1/accounts:signInWithCustomToken?key=any:
        post:
          body:
            application/json:
              token: "{{ steps.issueConsoleToken.res.body.firebaseCustomToken }}"
              returnSecureToken: true
    test: current.res.status == 200 && current.res.body.idToken != ""
    bind:
      consoleIDTokenPayload: replace(replace(split(current.res.body.idToken, ".")[1], "-", "+"), "_", "/")
  consoleIDTokenClaims:
    bind:
      consoleClaims: fromJSON(fromBase64(consoleIDTokenPayload + repeat("=", (4 - len(consoleIDTokenPayload) % 4) % 4)))
  consoleIDToken:
    test: |
      consoleClaims.sub == "user-console"
      && consoleClaims.tenant_id == vars.tenantId
      && consoleClaims.event_id == vars.eventId
      && consoleClaims.peer_role == "console"
      && !("edge_device_id" in consoleClaims)
      && !("session_id" in consoleClaims)
      && consoleClaims.token_use == "signaling"
      && consoleClaims.expires_at == date(steps.issueConsoleToken.res.body.expiresAt).Unix()
  signInConnection:
    auth:
      /identitytoolkit.googleapis.com/v1/accounts:signInWithCustomToken?key=any:
        post:
          body:
            application/json:
              token: "{{ steps.issueConnectionToken.res.body.firebaseCustomToken }}"
              returnSecureToken: true
    test: current.res.status == 200 && current.res.body.idToken != ""
    bind:
      connectionIDTokenPayload: replace(replace(split(current.res.body.idToken, ".")[1], "-", "+"), "_", "/")
  connectionIDTokenClaims:
    bind:
      connectionClaims: fromJSON(fromBase64(connectionIDTokenPayload + repeat("=", (4 - len(connectionIDTokenPayload) % 4) % 4)))
  connectionIDToken:
    test: |
      connectionClaims.sub == "user-connection"
      && connectionClaims.tenant_id == vars.tenantId
      && connectionClaims.event_id == vars.eventId
      && connectionClaims.peer_role == "console"
      && connectionClaims.edge_device_id == vars.edgeId
      && connectionClaims.session_id == steps.requestConnection.res.body.sessionId
      && connectionClaims.token_use == "signaling"
      && connectionClaims.expires_at == date(steps.issueConnectionToken.res.body.expiresAt).Unix()
  issueTokenWithoutToken:
    bridge:
      /tolo.edgebridge.v1.SignalingService/IssueFirestoreToken:
        post:
          body:
            application/json: {}
    test: current.res.status == 401 && current.res.body.code == "unauthenticated"
  issueTokenUnknownClient:
    bridge:
      /tolo.edgebridge.v1.SignalingService/IssueFirestoreToken:
        post:
          headers:
            Authorization: "Bearer {{ steps.unknownClientToken.res.body.access_token }}"
          body:
            application/json: {}
    test: current.res.status == 403 && current.res.body.code == "permission_denied"
  sessionRefs:
    bind:
      sessionURL: vars.documents + "/tenants/" + vars.tenantId + "/events/" + vars.eventId + "/edgeDevices/" + vars.edgeId + "/sessions/" + steps.requestConnection.res.body.sessionId
      sessionName: trimPrefix(vars.documents, "/v1/") + "/tenants/" + vars.tenantId + "/events/" + vars.eventId + "/edgeDevices/" + vars.edgeId + "/sessions/" + steps.requestConnection.res.body.sessionId
      secondSessionURL: vars.documents + "/tenants/" + vars.tenantId + "/events/" + vars.eventId + "/edgeDevices/" + vars.edgeId + "/sessions/" + steps.requestConnectionSecond.res.body.sessionId
      secondSessionName: trimPrefix(vars.documents + "/tenants/" + vars.tenantId + "/events/" + vars.eventId + "/edgeDevices/" + vars.edgeId + "/sessions/" + steps.requestConnectionSecond.res.body.sessionId, "/v1/")
      otherEdgeSessionURL: vars.documents + "/tenants/" + vars.tenantId + "/events/" + vars.eventId + "/edgeDevices/" + vars.otherEdgeId + "/sessions/" + steps.requestConnectionOtherEdge.res.body.sessionId
      otherEdgeSessionName: trimPrefix(vars.documents + "/tenants/" + vars.tenantId + "/events/" + vars.eventId + "/edgeDevices/" + vars.otherEdgeId + "/sessions/" + steps.requestConnectionOtherEdge.res.body.sessionId, "/v1/")
      edgeIDToken: steps.signInEdge.res.body.idToken
      cameraIDToken: steps.signInCamera.res.body.idToken
      consoleIDToken: steps.signInConsole.res.body.idToken
      connectionIDToken: steps.signInConnection.res.body.idToken
      expiredIDToken: |
        "eyJhbGciOiJub25lIiwidHlwIjoiSldUIn0." + trim(replace(replace(toBase64(toJSON(merge(edgeClaims, {"expires_at": 1}))), "+", "-"), "/", "_"), "=") + "."
      deliveryNotificationIDToken: |
        "eyJhbGciOiJub25lIiwidHlwIjoiSldUIn0." + trim(replace(replace(toBase64(toJSON(merge(edgeClaims, {"token_use": "delivery_notification"}))), "+", "-"), "/", "_"), "=") + "."
  sessionReadEdge:
    firestore:
      "{{ sessionURL }}":
        get:
          headers:
            Authorization: "Bearer {{ edgeIDToken }}"
    test: current.res.status == 200 && current.res.body.fields.status.stringValue == "requested"
  sessionReadConsole:
    firestore:
      "{{ sessionURL }}":
        get:
          headers:
            Authorization: "Bearer {{ consoleIDToken }}"
    test: current.res.status == 200 && current.res.body.fields.status.stringValue == "requested"
  sessionReadCamera:
    firestore:
      "{{ sessionURL }}":
        get:
          headers:
            Authorization: "Bearer {{ cameraIDToken }}"
    test: current.res.status == 200 && current.res.body.fields.status.stringValue == "requested"
  sessionReadConnection:
    firestore:
      "{{ sessionURL }}":
        get:
          headers:
            Authorization: "Bearer {{ connectionIDToken }}"
    test: current.res.status == 200 && current.res.body.fields.status.stringValue == "requested"
  sessionReadCameraOtherEdge:
    firestore:
      "{{ otherEdgeSessionURL }}":
        get:
          headers:
            Authorization: "Bearer {{ cameraIDToken }}"
    test: current.res.status == 403 && current.res.body.error.status == "PERMISSION_DENIED"
  sessionReadConnectionOtherEdge:
    firestore:
      "{{ otherEdgeSessionURL }}":
        get:
          headers:
            Authorization: "Bearer {{ connectionIDToken }}"
    test: current.res.status == 403 && current.res.body.error.status == "PERMISSION_DENIED"
  sessionReadConnectionOtherSession:
    firestore:
      "{{ secondSessionURL }}":
        get:
          headers:
            Authorization: "Bearer {{ connectionIDToken }}"
    test: current.res.status == 403 && current.res.body.error.status == "PERMISSION_DENIED"
  sessionReadConsoleOtherEdge:
    firestore:
      "{{ otherEdgeSessionURL }}":
        get:
          headers:
            Authorization: "Bearer {{ consoleIDToken }}"
    test: current.res.status == 200 && current.res.body.fields.status.stringValue == "requested"
  sessionsListEdge:
    firestore:
      "{{ vars.documents }}/tenants/{{ vars.tenantId }}/events/{{ vars.eventId }}/edgeDevices/{{ vars.edgeId }}/sessions":
        get:
          headers:
            Authorization: "Bearer {{ edgeIDToken }}"
    test: current.res.status == 200 && len(current.res.body.documents) == 2
  sessionReadNoAuth:
    firestore:
      "{{ sessionURL }}":
        get: {}
    test: current.res.status == 403 && current.res.body.error.status == "PERMISSION_DENIED"
  sessionReadExpired:
    firestore:
      "{{ sessionURL }}":
        get:
          headers:
            Authorization: "Bearer {{ expiredIDToken }}"
    test: current.res.status == 403 && current.res.body.error.status == "PERMISSION_DENIED"
  sessionReadOtherTokenUse:
    firestore:
      "{{ sessionURL }}":
        get:
          headers:
            Authorization: "Bearer {{ deliveryNotificationIDToken }}"
    test: current.res.status == 403 && current.res.body.error.status == "PERMISSION_DENIED"
  sessionReadOtherTenant:
    firestore:
      "{{ vars.documents }}/tenants/other-tenant/events/{{ vars.eventId }}/edgeDevices/{{ vars.edgeId }}/sessions/{{ steps.requestConnection.res.body.sessionId }}":
        get:
          headers:
            Authorization: "Bearer {{ consoleIDToken }}"
    test: current.res.status == 403 && current.res.body.error.status == "PERMISSION_DENIED"
  sessionReadOtherEvent:
    firestore:
      "{{ vars.documents }}/tenants/{{ vars.tenantId }}/events/other-event/edgeDevices/{{ vars.edgeId }}/sessions/{{ steps.requestConnection.res.body.sessionId }}":
        get:
          headers:
            Authorization: "Bearer {{ consoleIDToken }}"
    test: current.res.status == 403 && current.res.body.error.status == "PERMISSION_DENIED"
  sessionCreateConsole:
    firestore:
      "{{ vars.documents }}/tenants/{{ vars.tenantId }}/events/{{ vars.eventId }}/edgeDevices/{{ vars.edgeId }}/sessions/client-made":
        patch:
          headers:
            Authorization: "Bearer {{ consoleIDToken }}"
          body:
            application/json:
              fields:
                status:
                  stringValue: requested
    test: current.res.status == 403 && current.res.body.error.status == "PERMISSION_DENIED"
  sessionUpdateConsole:
    firestore:
      "{{ sessionURL }}?updateMask.fieldPaths=status&currentDocument.exists=true":
        patch:
          headers:
            Authorization: "Bearer {{ consoleIDToken }}"
          body:
            application/json:
              fields:
                status:
                  stringValue: accepted
    test: current.res.status == 403 && current.res.body.error.status == "PERMISSION_DENIED"
  signalCreateEdge:
    firestore:
      "{{ vars.documents }}:commit":
        post:
          headers:
            Authorization: "Bearer {{ edgeIDToken }}"
          body:
            application/json:
              writes:
                - update:
                    name: "{{ sessionName }}/signals/edge-offer"
                    fields:
                      from:
                        stringValue: edge
                      payload:
                        mapValue:
                          fields:
                            type:
                              stringValue: offer
                  updateTransforms:
                    - fieldPath: createdAt
                      setToServerValue: REQUEST_TIME
                  currentDocument:
                    exists: false
    test: current.res.status == 200
  signalCreateConsole:
    firestore:
      "{{ vars.documents }}:commit":
        post:
          headers:
            Authorization: "Bearer {{ consoleIDToken }}"
          body:
            application/json:
              writes:
                - update:
                    name: "{{ sessionName }}/signals/console-answer"
                    fields:
                      from:
                        stringValue: console
                      payload:
                        mapValue:
                          fields:
                            type:
                              stringValue: answer
                  updateTransforms:
                    - fieldPath: createdAt
                      setToServerValue: REQUEST_TIME
                  currentDocument:
                    exists: false
    test: current.res.status == 200
  signalReadAdmin:
    firestore:
      "{{ sessionURL }}/signals/edge-offer":
        get:
          headers:
            Authorization: Bearer owner
    test: |
      current.res.status == 200
      && current.res.body.fields.from.stringValue == "edge"
      && current.res.body.fields.payload.mapValue.fields.type.stringValue == "offer"
      && "timestampValue" in current.res.body.fields.createdAt
      && len(current.res.body.fields) == 3
  signalCreateWrongFrom:
    firestore:
      "{{ vars.documents }}:commit":
        post:
          headers:
            Authorization: "Bearer {{ edgeIDToken }}"
          body:
            application/json:
              writes:
                - update:
                    name: "{{ sessionName }}/signals/edge-as-console"
                    fields:
                      from:
                        stringValue: console
                      payload:
                        stringValue: offer
                  updateTransforms:
                    - fieldPath: createdAt
                      setToServerValue: REQUEST_TIME
                  currentDocument:
                    exists: false
    test: current.res.status == 403 && current.res.body.error.status == "PERMISSION_DENIED"
  signalCreateManagementFrom:
    firestore:
      "{{ vars.documents }}:commit":
        post:
          headers:
            Authorization: "Bearer {{ consoleIDToken }}"
          body:
            application/json:
              writes:
                - update:
