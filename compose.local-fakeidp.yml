# ローカル開発用のオーバーレイ。fakeidp の edge_device_id 対応コミット（3526ce2）が
# まだ push されていないため、sibling の tolo-service-gateway をビルドコンテキストにする。
# compose.yml のリモート pin は standalone 用に残し、fakeidp のコミットを push した後に
# compose.yml の pin をそのコミットへ bump する（その後このファイルは不要になる）。
services:
    fakeidp:
        build:
            context: ../tolo-service-gateway
            target: fakeidp
